# ********************************
# AAT VRX backpack -- Automatic antenna tracking
# ********************************
[env:AAT_ESP32_Backpack_via_UART]
extends = env_common_esp32
build_flags =
        ${common_env_data.build_flags}
        ${env_common_esp32.build_flags}
    -D TARGET_VRX_BACKPACK   
    -D AAT_BACKPACK          
    -D SSD1306_NO_SPLASH     
    -D PIN_BUTTON=25          
    -D PIN_LED=26            
    -D LED_INVERTED          
    -D PIN_SERVO_AZIM=27
    -D PIN_SERVO_ELEV=14
    -D PIN_OLED_SCL=21
    -D PIN_OLED_SDA=22
    -D DEBUG_LOG
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ 2.5.9
    madhephaestus/ESP32Servo
build_src_filter = ${common_env_data.build_src_filter} -<Tx_main.cpp> -<Test_main.cpp> -<rapidfire.*> -<rx5808.*> -<steadyview.*> -<Timer_main.cpp> -<mfd_crossbow.*>

[env:AAT_ESP32_Backpack_Perf]
extends = env:AAT_ESP32_Backpack_via_UART
build_flags =
    ${env:AAT_ESP32_Backpack_via_UART.build_flags}
    -D AAT_PERF_DEBUG

[env:AAT_ESP32_Backpack_Compass]
extends = env:AAT_ESP32_Backpack_via_UART
build_flags =
    ${env:AAT_ESP32_Backpack_via_UART.build_flags}
    -D AAT_COMPASS_DEBUG

[env:AAT_ESP32_Backpack_Compass_HomeWiFi]
extends = env:AAT_ESP32_Backpack_Compass
build_flags =
    ${env:AAT_ESP32_Backpack_Compass.build_flags}
    -D AAT_COMPASS_DEBUG_USE_HOME_WIFI

[env:AAT_ESP32_Backpack_Compass_I2CTrace]
extends = env:AAT_ESP32_Backpack_Compass_HomeWiFi
build_flags =
    ${env:AAT_ESP32_Backpack_Compass_HomeWiFi.build_flags}
    -D AAT_I2C_TRACE

[env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot]
extends = env:AAT_ESP32_Backpack_Compass_I2CTrace
build_flags =
    ${env:AAT_ESP32_Backpack_Compass_I2CTrace.build_flags}
    -D AAT_I2C_TRACE_SINGLE_SHOT

[env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot_NoOLED]
extends = env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot
build_flags =
    ${env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot.build_flags}
    -D AAT_SERVO_TEST_DISABLE_OLED

[env:AAT_ESP32_Backpack_Compass_I2CTrace_StopRead]
extends = env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot_NoOLED
build_flags =
    ${env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot_NoOLED.build_flags}
    -D AAT_I2C_TRACE_STOP_READ

[env:AAT_ESP32_Backpack_Compass_I2CTrace_DeferredStatus]
extends = env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot_NoOLED
build_flags =
    ${env:AAT_ESP32_Backpack_Compass_I2CTrace_SingleShot_NoOLED.build_flags}
    -D AAT_I2C_TRACE_DEFER_STATUS

[env:AAT_ESP32_Backpack_ServoTest]
extends = env:AAT_ESP32_Backpack_via_UART
build_flags =
    ${env:AAT_ESP32_Backpack_via_UART.build_flags}
    -D AAT_SERVO_TEST
    -D PIN_AAT_REFERENCE_BUTTON=32

[env:AAT_ESP32_Backpack_ServoTest_Config16]
extends = env:AAT_ESP32_Backpack_ServoTest
build_flags =
    ${env:AAT_ESP32_Backpack_ServoTest.build_flags}
    -D AAT_SERVO_TEST_COMPASS_CONFIG_A=0x10

[env:AAT_ESP32_Backpack_CompassPan]
extends = env:AAT_ESP32_Backpack_via_UART
build_flags =
    ${env:AAT_ESP32_Backpack_via_UART.build_flags}
    -D AAT_COMPASS_TRACKING
    -D PIN_AAT_REFERENCE_BUTTON=32
    -D AAT_COMPASS_TRACKING_CONFIG_A=0x10

[env:AAT_ESP32_Backpack_CompassPan_Trace]
extends = env:AAT_ESP32_Backpack_CompassPan
build_flags =
    ${env:AAT_ESP32_Backpack_CompassPan.build_flags}
    -D AAT_COMPASS_TRACKING_TRACE

[env:AAT_ESP32_Backpack_CompassPan_HomeWiFi]
extends = env:AAT_ESP32_Backpack_CompassPan
build_flags =
    ${env:AAT_ESP32_Backpack_CompassPan.build_flags}
    -D AAT_COMPASS_DEBUG
    -D AAT_COMPASS_DEBUG_USE_HOME_WIFI

[env:AAT_ESP32_Backpack_CompassPan_AP]
extends = env:AAT_ESP32_Backpack_CompassPan
build_flags =
    ${env:AAT_ESP32_Backpack_CompassPan.build_flags}
    -D AAT_COMPASS_DEBUG

[env:AAT_ESP32_Backpack_CompassPan_SetupTest]
extends = env:AAT_ESP32_Backpack_CompassPan_AP
build_flags =
    ${env:AAT_ESP32_Backpack_CompassPan_AP.build_flags}
    -D AAT_COMPASS_SETUP_TEST

[env:AAT_ESP32_Backpack_ServoTest_Continuous]
extends = env:AAT_ESP32_Backpack_ServoTest
build_flags =
    ${env:AAT_ESP32_Backpack_ServoTest.build_flags}
    -D AAT_SERVO_TEST_CONTINUOUS_COMPASS

[env:AAT_ESP32_Backpack_ServoTest_Continuous_NoOLED]
extends = env:AAT_ESP32_Backpack_ServoTest_Continuous
build_flags =
    ${env:AAT_ESP32_Backpack_ServoTest_Continuous.build_flags}
    -D AAT_SERVO_TEST_DISABLE_OLED

[env:AAT_ESP32_Backpack_ServoTest_Continuous_NoOLED_15Hz]
extends = env:AAT_ESP32_Backpack_ServoTest_Continuous_NoOLED
build_flags =
    ${env:AAT_ESP32_Backpack_ServoTest_Continuous_NoOLED.build_flags}
    -D AAT_SERVO_TEST_COMPASS_CONFIG_A=0x70

[env:AAT_ESP_Backpack_via_UART]
extends = env_common_esp12e
build_flags =
	${common_env_data.build_flags}
	${env_common_esp12e.build_flags}
    -D TARGET_VRX_BACKPACK
    -D AAT_BACKPACK
    -D SSD1306_NO_SPLASH
    -D PIN_BUTTON=0
    -D PIN_LED=16
    -D LED_INVERTED
    -D PIN_SERVO_AZIM=9
    -D PIN_SERVO_ELEV=10
    -D PIN_OLED_SCL=1
    -D PIN_OLED_SDA=3
    ; -D DEBUG_LOG
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ 2.5.9
build_src_filter = ${common_env_data.build_src_filter} -<Tx_main.cpp> -<Test_main.cpp> -<rapidfire.*> -<rx5808.*> -<steadyview.*> -<Timer_main.cpp> -<mfd_crossbow.*>

[env:AAT_ESP_Backpack_via_WIFI]
extends = env:AAT_ESP_Backpack_via_UART
